<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Holdings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111111;
    --surface:#181818;
    --card:#202020;
    --card-raised:#242424;
    --primary:#F5F5F5;
    --secondary:#929292;
    --tertiary:#6B6B6B;
    --accent:#FF9F0A;
    --accent-dim:#7A4E10;
    --profit:#30D158;
    --loss:#FF453A;
    --border:#303030;
    --border-soft:#262626;
    --shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--primary);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }

  ::selection{ background:var(--accent); color:#111; }

  a{color:inherit;}

  .shell{
    max-width:1180px;
    margin:0 auto;
    padding:28px 24px 80px;
  }

  /* ---------- macOS-style window chrome ---------- */
  .titlebar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 18px;
    background:var(--surface);
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  }
  .dots{ display:flex; gap:8px; flex:0 0 auto; }
  .dots span{ width:11px; height:11px; border-radius:50%; display:block; }
  .dot-r{ background:#FF5F57; }
  .dot-y{ background:#FEBC2E; }
  .dot-g{ background:#28C840; }
  .titlebar-label{
    flex:1;
    text-align:center;
    font-family:var(--font-mono);
    font-size:12px;
    letter-spacing:0.06em;
    color:var(--secondary);
    text-transform:uppercase;
    margin-right:33px; /* balance dots width */
  }

  .app-frame{
    background:var(--surface);
    border:1px solid var(--border);
    border-top:none;
    border-radius:0 0 var(--radius-lg) var(--radius-lg);
    padding:36px 36px 40px;
    box-shadow:var(--shadow);
  }

  header.app-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    margin-bottom:32px;
    flex-wrap:wrap;
  }
  header.app-header h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:34px;
    letter-spacing:-0.01em;
    margin:0;
    text-wrap:balance;
  }
  header.app-header .accent-dot{
    display:inline-block;
    width:9px; height:9px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 14px 2px rgba(255,159,10,0.55);
    margin-right:10px;
    vertical-align:middle;
  }
  header.app-header p{
    margin:0;
    color:var(--secondary);
    font-size:14px;
    max-width:38ch;
  }

  /* ---------- layout ---------- */
  main.layout{
    display:grid;
    grid-template-columns:minmax(280px, 360px) 1fr;
    gap:24px;
    align-items:start;
  }
  @media (max-width:860px){
    main.layout{ grid-template-columns:1fr; }
  }

  .panel{
    background:var(--card);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-lg);
    padding:24px;
  }

  .panel + .panel{ margin-top:20px; }

  .panel-title{
    font-size:13px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--secondary);
    margin:0 0 18px;
  }

  /* ---------- form ---------- */
  .field{ margin-bottom:16px; }
  .field label{
    display:block;
    font-size:13px;
    color:var(--secondary);
    margin-bottom:7px;
  }
  .field input{
    width:100%;
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--primary);
    font-family:var(--font-body);
    font-size:15px;
    padding:11px 13px;
    border-radius:var(--radius-sm);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input::placeholder{ color:var(--tertiary); }
  .field input:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(255,159,10,0.18);
  }
  .field-hint{ font-size:11.5px; color:var(--tertiary); margin-top:6px; }

  .form-actions{ display:flex; gap:10px; margin-top:20px; }

  button{
    font-family:var(--font-body);
    font-size:14px;
    font-weight:600;
    border-radius:var(--radius-sm);
    border:1px solid transparent;
    padding:11px 18px;
    cursor:pointer;
    transition:transform .1s ease, background .15s ease, border-color .15s ease, opacity .15s ease;
  }
  button:active{ transform:scale(0.98); }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .btn-primary{ background:var(--accent); color:#1a1200; }
  .btn-primary:hover{ background:#FFB13D; }
  .btn-ghost{ background:transparent; color:var(--secondary); border-color:var(--border); }
  .btn-ghost:hover{ color:var(--primary); border-color:var(--secondary); }
  .btn-danger{ background:transparent; color:var(--loss); border-color:rgba(255,69,58,0.4); }
  .btn-danger:hover{ background:rgba(255,69,58,0.1); border-color:var(--loss); }
  .btn-sm{ padding:8px 14px; font-size:13px; }

  .link-btn{
    background:none; border:none; padding:0;
    font-size:12.5px; font-weight:600;
    cursor:pointer;
  }
  .link-btn.edit{ color:var(--accent); }
  .link-btn.delete{ color:var(--loss); }
  .link-btn:hover{ text-decoration:underline; }

  /* ---------- summary ---------- */
  .summary-total{
    font-family:var(--font-display);
    font-weight:500;
    font-size:38px;
    letter-spacing:-0.01em;
    font-variant-numeric:tabular-nums;
    margin:4px 0 2px;
    text-shadow:0 0 30px rgba(255,159,10,0.12);
  }
  .summary-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12.5px;
    color:var(--tertiary);
    margin-top:10px;
    font-family:var(--font-mono);
  }
  .summary-row .count{ color:var(--secondary); }

  /* ---------- donut + legend ---------- */
  .allocation-grid{
    display:flex;
    gap:32px;
    align-items:center;
    flex-wrap:wrap;
  }
  .donut-wrap{ position:relative; width:200px; height:200px; flex:0 0 auto; }
  .donut-wrap svg{ width:100%; height:100%; }
  .donut-center{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .donut-center .label{ font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--tertiary); }
  .donut-center .value{ font-family:var(--font-mono); font-size:13px; color:var(--primary); margin-top:4px; text-align:center; padding:0 10px; }

  .legend{ list-style:none; margin:0; padding:0; flex:1; min-width:220px; }
  .legend li{
    display:flex; align-items:center; gap:12px;
    padding:9px 0;
    border-bottom:1px solid var(--border-soft);
  }
  .legend li:last-child{ border-bottom:none; }
  .swatch{ width:10px; height:10px; border-radius:3px; flex:0 0 auto; }
  .legend .name{ font-size:14px; color:var(--primary); flex:1; }
  .legend .pct{ font-family:var(--font-mono); font-size:13px; color:var(--secondary); }

  .empty-state{
    color:var(--tertiary);
    font-size:13.5px;
    padding:18px 0;
  }

  /* ---------- table ---------- */
  .table-scroll{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  thead th{
    text-align:left;
    font-weight:600;
    font-size:11px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--tertiary);
    padding:0 12px 10px;
    white-space:nowrap;
  }
  tbody td{
    padding:14px 12px;
    border-top:1px solid var(--border-soft);
    white-space:nowrap;
  }
  tbody tr:hover{ background:rgba(255,255,255,0.02); }
  td.name{ font-weight:500; white-space:normal; }
  td.mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .diff-pos{ color:var(--profit); }
  .diff-neg{ color:var(--loss); }
  .target-tag{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--secondary);
    background:var(--bg);
    border:1px solid var(--border);
    padding:2px 8px;
    border-radius:20px;
  }

  .table-toolbar{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:18px;
    flex-wrap:wrap;
  }

  /* ---------- toast ---------- */
  #toast{
    position:fixed;
    bottom:24px; left:50%;
    transform:translate(-50%, 12px);
    background:var(--card-raised);
    border:1px solid var(--border);
    color:var(--primary);
    padding:12px 18px;
    border-radius:var(--radius-sm);
    font-size:13.5px;
    box-shadow:var(--shadow);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:60;
    max-width:90vw;
  }
  #toast.show{ opacity:1; transform:translate(-50%, 0); pointer-events:auto; }
  #toast.err{ border-color:rgba(255,69,58,0.5); }
  #toast .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--profit); margin-right:9px; }
  #toast.err .dot{ background:var(--loss); }

  /* ---------- confirm dialog ---------- */
  #modal-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.55);
    display:none;
    align-items:center; justify-content:center;
    z-index:70;
    padding:24px;
  }
  #modal-overlay.show{ display:flex; }
  .modal{
    background:var(--card-raised);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:24px;
    width:100%;
    max-width:340px;
    box-shadow:var(--shadow);
  }
  .modal h3{ margin:0 0 8px; font-family:var(--font-display); font-weight:600; font-size:19px; }
  .modal p{ margin:0 0 20px; color:var(--secondary); font-size:13.5px; line-height:1.5; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; }

  input[type="file"]{ display:none; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<div class="shell">
  <div class="titlebar">
    <div class="dots"><span class="dot-r"></span><span class="dot-y"></span><span class="dot-g"></span></div>
    <div class="titlebar-label">Holdings.app</div>
  </div>

  <div class="app-frame">
    <header class="app-header">
      <div>
        <h1><span class="accent-dot"></span>Holdings</h1>
        <p>Catat aset, lihat total kekayaan, dan pantau alokasi terhadap target.</p>
      </div>
    </header>

    <main class="layout">
      <!-- LEFT COLUMN -->
      <div>
        <section class="panel">
          <h2 class="panel-title" id="form-title">Tambah Aset</h2>
          <form id="asset-form" autocomplete="off">
            <div class="field">
              <label for="f-name">Nama Aset</label>
              <input id="f-name" type="text" required placeholder="Bitcoin, Saham BBCA, Emas" />
            </div>
            <div class="field">
              <label for="f-value">Nilai Aset</label>
              <input id="f-value" type="text" inputmode="numeric" required placeholder="500.000.000" />
              <div class="field-hint">Boleh pakai titik/koma ribuan, contoh: 10.000.000</div>
            </div>
            <div class="field" style="margin-bottom:0;">
              <label for="f-target">Target Alokasi % <span style="color:var(--tertiary)">— opsional</span></label>
              <input id="f-target" type="number" min="0" max="100" step="0.01" placeholder="20" />
            </div>
            <div class="form-actions">
              <button type="submit" class="btn-primary" id="submit-btn">Tambah</button>
              <button type="button" class="btn-ghost" id="clear-form-btn">Bersihkan</button>
            </div>
          </form>
        </section>

        <section class="panel">
          <h2 class="panel-title">Total Portofolio</h2>
          <div class="summary-total" id="summary-total">Rp0</div>
          <div class="summary-row">
            <span><span class="count" id="summary-count">0</span> aset tercatat</span>
            <span id="summary-updated">—</span>
          </div>
        </section>
      </div>

      <!-- RIGHT COLUMN -->
      <div>
        <section class="panel">
          <h2 class="panel-title">Distribusi Aset</h2>
          <div id="allocation-body"></div>
        </section>

        <section class="panel">
          <h2 class="panel-title">Rincian Kepemilikan</h2>
          <div id="table-body"></div>
          <div class="table-toolbar">
            <button class="btn-danger btn-sm" id="clear-all-btn">Hapus Semua</button>
            <button class="btn-ghost btn-sm" id="export-btn">Export JSON</button>
            <label class="btn-ghost btn-sm" for="import-input" style="display:inline-flex;align-items:center;">Import JSON</label>
            <input type="file" id="import-input" accept=".json" />
          </div>
        </section>
      </div>
    </main>
  </div>
</div>

<div id="toast"><span class="dot"></span><span id="toast-msg"></span></div>

<div id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title">Konfirmasi</h3>
    <p id="modal-body">Apakah kamu yakin?</p>
    <div class="modal-actions">
      <button class="btn-ghost btn-sm" id="modal-cancel">Batal</button>
      <button class="btn-danger btn-sm" id="modal-confirm">Hapus</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "holdings_assets_v1";
  var LAST_UPDATED_KEY = "holdings_last_updated_v1";

  var CHART_COLORS = ["#FF9F0A","#E8B45C","#4A9B8E","#C97B63","#7C93C9","#A78BFA","#D4A5A5","#8FBF8F"];

  var seedAssets = [
    { id: uid(), name: "Saham BBCA", value: 85000000, target: 25 },
    { id: uid(), name: "Reksadana Saham", value: 42000000, target: 15 },
    { id: uid(), name: "Emas Antam", value: 30000000, target: 20 },
    { id: uid(), name: "Deposito", value: 60000000, target: 30 },
    { id: uid(), name: "Bitcoin", value: 18000000, target: 10 }
  ];

  var state = {
    assets: [],
    lastUpdated: null,
    editingId: null
  };

  var downloads = null;
  if (window.claude && typeof window.claude.use === "function"){
    window.claude.use("downloads").then(function(ns){ downloads = ns; }).catch(function(){});
  }

  function uid(){ return "id_" + Math.random().toString(36).slice(2, 9); }

  function formatCurrency(v){
    return new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(v || 0);
  }

  function parseNumberInput(str){
    if (!str) return 0;
    var cleaned = String(str).replace(/[^\d,.-]/g, "").replace(/,/g, ".");
    var num = parseFloat(cleaned);
    return isNaN(num) ? 0 : num;
  }

  function formatDateTime(iso){
    var d = new Date(iso);
    var time = d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
    var dateStr = d.toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" });
    return time + ", " + dateStr;
  }

  function sortedAssets(){
    return state.assets.slice().sort(function(a, b){ return b.value - a.value; });
  }

  function colorFor(i){ return CHART_COLORS[i % CHART_COLORS.length]; }

  function totalValue(){
    return state.assets.reduce(function(s, a){ return s + (Number(a.value) || 0); }, 0);
  }

  /* ---------------- persistence ---------------- */

  function loadInitial(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : null;
      if (Array.isArray(parsed) && parsed.length){
        state.assets = parsed;
        state.lastUpdated = localStorage.getItem(LAST_UPDATED_KEY);
      } else {
        state.assets = seedAssets;
        state.lastUpdated = null;
      }
    } catch(e){
      state.assets = seedAssets;
    }
  }

  function persist(){
    var now = new Date().toISOString();
    state.lastUpdated = now;
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.assets));
      localStorage.setItem(LAST_UPDATED_KEY, now);
    } catch(e){ /* storage unavailable */ }
  }

  /* ---------------- rendering ---------------- */

  var el = {
    formTitle: document.getElementById("form-title"),
    form: document.getElementById("asset-form"),
    name: document.getElementById("f-name"),
    value: document.getElementById("f-value"),
    target: document.getElementById("f-target"),
    submitBtn: document.getElementById("submit-btn"),
    clearFormBtn: document.getElementById("clear-form-btn"),
    summaryTotal: document.getElementById("summary-total"),
    summaryCount: document.getElementById("summary-count"),
    summaryUpdated: document.getElementById("summary-updated"),
    allocationBody: document.getElementById("allocation-body"),
    tableBody: document.getElementById("table-body"),
    clearAllBtn: document.getElementById("clear-all-btn"),
    exportBtn: document.getElementById("export-btn"),
    importInput: document.getElementById("import-input"),
    toast: document.getElementById("toast"),
    toastMsg: document.getElementById("toast-msg"),
    modalOverlay: document.getElementById("modal-overlay"),
    modalTitle: document.getElementById("modal-title"),
    modalBody: document.getElementById("modal-body"),
    modalCancel: document.getElementById("modal-cancel"),
    modalConfirm: document.getElementById("modal-confirm")
  };

  function render(){
    renderSummary();
    renderAllocation();
    renderTable();
  }

  function renderSummary(){
    el.summaryTotal.textContent = formatCurrency(totalValue());
    el.summaryCount.textContent = state.assets.length;
    el.summaryUpdated.textContent = state.lastUpdated ? formatDateTime(state.lastUpdated) : "belum ada perubahan";
  }

  function renderAllocation(){
    var assets = sortedAssets();
    var total = totalValue();

    if (assets.length === 0){
      el.allocationBody.innerHTML = '<div class="empty-state">Belum ada data aset.</div>';
      return;
    }

    var r = 78, cx = 100, cy = 100, sw = 34;
    var circumference = 2 * Math.PI * r;
    var acc = 0;
    var arcs = "";

    assets.forEach(function(a, i){
      var portion = total > 0 ? a.value / total : 0;
      var dash = portion * circumference;
      var gap = circumference - dash;
      arcs += '<circle r="' + r + '" cx="0" cy="0" fill="none" stroke="' + colorFor(i) + '" stroke-width="' + sw + '" stroke-dasharray="' + dash + ' ' + gap + '" stroke-dashoffset="' + (-acc) + '"></circle>';
      acc += dash;
    });

    var svg = '<svg viewBox="0 0 200 200"><g transform="translate(' + cx + ',' + cy + ') rotate(-90)">' + arcs + '</g></svg>';

    var legendItems = assets.map(function(a, i){
      var pct = total > 0 ? ((a.value / total) * 100).toFixed(2) : "0.00";
      return '<li><span class="swatch" style="background:' + colorFor(i) + '"></span>' +
        '<span class="name">' + escapeHtml(a.name) + '</span>' +
        '<span class="pct">' + pct + '%</span></li>';
    }).join("");

    el.allocationBody.innerHTML =
      '<div class="allocation-grid">' +
        '<div class="donut-wrap">' + svg +
          '<div class="donut-center"><span class="label">Total</span><span class="value">' + formatCurrency(total) + '</span></div>' +
        '</div>' +
        '<ul class="legend">' + legendItems + '</ul>' +
      '</div>';
  }

  function renderTable(){
    var assets = sortedAssets();
    var total = totalValue();

    if (assets.length === 0){
      el.tableBody.innerHTML = '<div class="empty-state">Belum ada data aset. Tambahkan lewat form di sebelah kiri.</div>';
      return;
    }

    var rows = assets.map(function(a){
      var pct = total > 0 ? (a.value / total) * 100 : 0;
      var hasTarget = a.target != null && total > 0;
      var selisih = hasTarget ? a.value - (a.target / 100) * total : 0;
      var selisihHtml = "-";
      if (hasTarget){
        var cls = selisih >= 0 ? "diff-pos" : "diff-neg";
        selisihHtml = '<span class="' + cls + '">' + (selisih >= 0 ? "+" : "") + formatCurrency(selisih) + '</span>';
      }
      return '<tr data-id="' + a.id + '">' +
        '<td class="name">' + escapeHtml(a.name) + '</td>' +
        '<td class="mono">' + formatCurrency(a.value) + '</td>' +
        '<td class="mono">' + pct.toFixed(2) + '%</td>' +
        '<td>' + (a.target ? '<span class="target-tag">' + a.target.toFixed(2) + '%</span>' : '-') + '</td>' +
        '<td class="mono">' + selisihHtml + '</td>' +
        '<td>' +
          '<button class="link-btn edit" data-action="edit" data-id="' + a.id + '">Edit</button> ' +
          '<button class="link-btn delete" data-action="delete" data-id="' + a.id + '">Hapus</button>' +
        '</td>' +
      '</tr>';
    }).join("");

    el.tableBody.innerHTML =
      '<div class="table-scroll"><table><thead><tr>' +
        '<th>Aset</th><th>Nilai</th><th>% Total</th><th>Target</th><th>Selisih Target</th><th>Aksi</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ---------------- form handling ---------------- */

  function resetForm(){
    el.name.value = "";
    el.value.value = "";
    el.target.value = "";
  }

  function enterEdit(id){
    var asset = state.assets.find(function(a){ return a.id === id; });
    if (!asset) return;
    state.editingId = id;
    el.name.value = asset.name;
    el.value.value = asset.value;
    el.target.value = asset.target != null ? asset.target : "";
    el.formTitle.textContent = "Edit Aset";
    el.submitBtn.textContent = "Update";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function exitEdit(){
    state.editingId = null;
    el.formTitle.textContent = "Tambah Aset";
    el.submitBtn.textContent = "Tambah";
    resetForm();
  }

  el.form.addEventListener("submit", function(e){
    e.preventDefault();
    var name = el.name.value.trim();
    var value = parseNumberInput(el.value.value.trim());
    var target = el.target.value ? Number(el.target.value) : null;

    if (!name || !value){
      showToast("Isi nama dan nilai aset dengan benar.", true);
      return;
    }

    if (state.editingId){
      state.assets = state.assets.map(function(a){
        return a.id === state.editingId ? Object.assign({}, a, { name: name, value: value, target: target }) : a;
      });
      showToast("Aset diperbarui.");
    } else {
      state.assets.push({ id: uid(), name: name, value: value, target: target });
      showToast("Aset ditambahkan.");
    }

    persist();
    exitEdit();
    render();
  });

  el.clearFormBtn.addEventListener("click", exitEdit);

  el.tableBody.addEventListener("click", function(e){
    var btn = e.target.closest("button[data-action]");
    if (!btn) return;
    var id = btn.getAttribute("data-id");
    if (btn.getAttribute("data-action") === "edit"){
      enterEdit(id);
    } else {
      var asset = state.assets.find(function(a){ return a.id === id; });
      openModal("Hapus Aset", 'Hapus "' + (asset ? asset.name : "") + '" dari portofolio?', function(){
        state.assets = state.assets.filter(function(a){ return a.id !== id; });
        persist();
        if (state.editingId === id) exitEdit();
        render();
        showToast("Aset dihapus.");
      });
    }
  });

  el.clearAllBtn.addEventListener("click", function(){
    if (state.assets.length === 0) return;
    openModal("Hapus Semua Data", "Semua aset akan dihapus permanen dari perangkat ini. Lanjutkan?", function(){
      state.assets = [];
      exitEdit();
      persist();
      render();
      showToast("Semua data dihapus.");
    });
  });

  el.exportBtn.addEventListener("click", function(){
    var blob = new Blob([JSON.stringify(state.assets, null, 2)], { type: "application/json" });

    if (downloads){
      downloads.save({ filename: "holdings.json", data: blob }).then(function(){
        showToast("Portofolio diexport.");
      }).catch(function(err){
        if (err && err.code !== "declined") showToast("Gagal export: " + err.message, true);
      });
      return;
    }

    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "holdings.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast("Portofolio diexport.");
  });

  el.importInput.addEventListener("change", function(e){
    var file = e.target.files[0];
    if (!file) return;
    file.text().then(function(text){
      var data = JSON.parse(text);
      if (!Array.isArray(data)) throw new Error("Format JSON tidak valid");
      var imported = data.map(function(d){
        return { id: uid(), name: String(d.name || "Tanpa nama"), value: Number(d.value) || 0, target: Number(d.target) || null };
      });
      state.assets = state.assets.concat(imported);
      persist();
      render();
      showToast(imported.length + " aset diimport.");
    }).catch(function(err){
      showToast("Gagal import: " + err.message, true);
    }).finally(function(){
      el.importInput.value = "";
    });
  });

  /* ---------------- toast ---------------- */

  var toastTimer = null;
  function showToast(msg, isError){
    el.toastMsg.textContent = msg;
    el.toast.classList.toggle("err", !!isError);
    el.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.toast.classList.remove("show"); }, 2800);
  }

  /* ---------------- modal ---------------- */

  var pendingConfirm = null;

  function openModal(title, body, onConfirm){
    el.modalTitle.textContent = title;
    el.modalBody.textContent = body;
    pendingConfirm = onConfirm;
    el.modalOverlay.classList.add("show");
  }
  function closeModal(){
    el.modalOverlay.classList.remove("show");
    pendingConfirm = null;
  }
  el.modalCancel.addEventListener("click", closeModal);
  el.modalOverlay.addEventListener("click", function(e){ if (e.target === el.modalOverlay) closeModal(); });
  el.modalConfirm.addEventListener("click", function(){
    var fn = pendingConfirm;
    closeModal();
    if (fn) fn();
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape") closeModal();
  });

  /* ---------------- init ---------------- */

  loadInitial();
  render();
})();
</script>
</body>
</html>
